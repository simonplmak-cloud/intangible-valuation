name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  webapp-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests + content audit
        run: npm run test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Accessibility + billing E2E
        run: npx playwright test tests-webapp/e2e/a11y.spec.ts tests-webapp/e2e/billing.spec.ts --project=chromium
